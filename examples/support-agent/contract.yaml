apiVersion: axda.dev/v1
kind: AgentContract
metadata:
  name: support-agent

spec:
  # Every invariant operand says where it comes from. An undeclared identifier
  # is a compile error, and `cardinality` is required rather than defaulted —
  # a policy that silently checks only the first of five refunds is the exact
  # bug this field prevents (ADR-003 §4).
  values:
    refund.amount:
      from: tool_call
      tool: billing.refund
      arg: amount
      cardinality: any          # the constraint must hold for EVERY refund

    approved_limit:
      from: tool_result
      tool: crm.lookup
      path: $.customer.refund_limit
      cardinality: last

    customer.tier:
      from: tool_result
      tool: crm.lookup
      path: $.customer.tier
      cardinality: last
      default: standard         # absent tier is not a skip, it is "standard"

  invariants:
    - "refund.amount <= approved_limit"
    - 'customer.tier == "enterprise" || refund.amount <= 500'

  # Delegation to a sub-agent is also an action, so nested invoke_agent spans
  # are governed by this list too (ADR-002 §6).
  allowed_tools:
    - crm.lookup
    - crm.verify_identity
    - billing.refund
    - email.send

  must:
    # Violation-decidable on a prefix: detectable the moment billing.refund is
    # attempted with no completed verification before it (ADR-005 §2).
    - kind: order.requires_precondition
      action: billing.refund
      precondition: crm.verify_identity

    - kind: tool.call_limit
      tool: billing.refund
      max: 1

    - kind: budget.max_steps
      value: 20

    - kind: budget.max_tool_errors
      value: 0

    # CUE schema unification over captured tool arguments.
    - kind: tool.args_match
      tool: billing.refund
      schema: |
        {
          customer_id: =~"^C-[0-9]+$"
          order_id:    string
          amount:      number & >0
        }

    # Requires has_token_usage; reports SKIPPED, never PASS, when the trace
    # carries no gen_ai.usage.* attributes.
    - kind: budget.max_tokens
      value: 50000

    # Deterministic: claims are extracted structurally (ADR-002 §4), so a
    # grounding verdict can block the build.
    - kind: grounding.cite_sources
      min_support: 1

    # Probabilistic: advisory unless the clause sets blocking: true.
    - kind: quality.helpful

  must_not:
    # Sending an address to email.send is the job. Policies express where PII
    # may travel, not merely whether it appears (ADR-003 §2).
    - kind: content.no_pii
      types: [card, ssn, email]
      allow_in_tool_args: [email.send, crm.lookup]

    - kind: content.deny_patterns
      patterns:
        - '(?i)\bpassword\s*[:=]'
        - '(?i)\bapi[_-]?key\s*[:=]'
